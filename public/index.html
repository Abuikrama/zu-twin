<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zeeshan Twin</title>
<style>
:root{--bg:#f6f5f2;--panel:#fff;--ink:#1d1d1b;--muted:#6b6a66;--line:#e3e1dc;--accent:#0f6e5c;--me:#e8f2ef;--warn:#fff4dc;--warnline:#e9cf8f}
@media (prefers-color-scheme:dark){:root{--bg:#141413;--panel:#1d1d1b;--ink:#ecebe7;--muted:#9b9a95;--line:#33322f;--accent:#4fbfa5;--me:#1f3330;--warn:#2e2715;--warnline:#6b5a2a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;height:100vh;height:100dvh;display:flex;flex-direction:column}
header{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;background:var(--panel)}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
header h1{font-size:16px;margin:0}
header p{margin:0;color:var(--muted);font-size:13px}
header button{margin-left:auto}
.notice{background:var(--warn);border-bottom:1px solid var(--warnline);padding:6px 16px;font-size:13px}
main{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;max-width:820px;width:100%;margin:0 auto}
.msg{padding:10px 14px;border-radius:12px;max-width:85%;white-space:pre-wrap;word-wrap:break-word}
.user{align-self:flex-end;background:var(--me)}
.bot{align-self:flex-start;background:var(--panel);border:1px solid var(--line)}
.err{align-self:center;color:#c0392b;font-size:13px}
form.chat{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line);background:var(--panel);max-width:820px;width:100%;margin:0 auto}
textarea,input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
form.chat textarea{resize:none;height:44px}
button{font:inherit;background:var(--accent);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button:disabled{opacity:.5;cursor:default}
.starters{display:flex;flex-wrap:wrap;gap:8px}
.starters button{background:var(--panel);color:var(--ink);border:1px solid var(--line);font-size:13px}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);width:min(420px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog .row{display:flex;gap:8px;margin-top:12px}
</style>
</head>
<body>
<header>
  <div class="avatar">ZU</div>
  <div><h1>Zeeshan Usmani · Digital Twin</h1><p>Data scientist, author, educator</p></div>
  <button class="ghost" id="clear">New chat</button>
</header>
<div class="notice">This is an AI made with Zeeshan Usmani's permission. It is not the real person, and it can be wrong.</div>
<main id="log"></main>
<form class="chat" id="chatForm">
  <textarea id="input" placeholder="Ask Zeeshan's twin anything…"></textarea>
  <button id="send">Send</button>
</form>

<dialog id="codeDialog">
  <form method="dialog" id="codeForm">
    <h2 style="margin:0 0 8px">Enter access code</h2>
    <p style="margin:0;color:var(--muted);font-size:14px">This demo is private. Ask the person who shared it for the code.</p>
    <div class="row"><input id="code" autocomplete="off" placeholder="Access code"><button>Continue</button></div>
  </form>
</dialog>

<script>
const $ = (id) => document.getElementById(id);
const store = {
  get(k, d) { try { return localStorage.getItem(k) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} }
};
const STARTERS = ['How do I start a career in data science?', 'Should I study abroad?', 'Will AI take our jobs?', 'Tell me about your research on suicide bombings'];
let history = [];
let needsCode = false;

function addMsg(cls, text) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls; d.textContent = text;
  $('log').appendChild(d); $('log').scrollTop = $('log').scrollHeight;
  return d;
}
function reset() {
  history = [];
  $('log').innerHTML = '';
  addMsg('bot', "Assalam o Alaikum! I'm the AI twin of Zeeshan Usmani. Ask me about data science, AI, careers, studying abroad, or my research.");
  const s = document.createElement('div'); s.className = 'starters'; s.id = 'starters';
  for (const t of STARTERS) { const b = document.createElement('button'); b.textContent = t; b.onclick = () => send(t); s.appendChild(b); }
  $('log').appendChild(s);
}

async function send(text) {
  if (needsCode && !store.get('zt_code', '')) { $('codeDialog').showModal(); return; }
  $('starters')?.remove();
  addMsg('user', text);
  history.push({ role: 'user', content: text });
  const out = addMsg('bot', '…');
  $('send').disabled = true;
  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ messages: history, code: store.get('zt_code', '') })
    });
    if (!res.ok) {
      const err = (await res.json().catch(() => ({}))).error || res.statusText;
      if (res.status === 401) { store.set('zt_code', ''); setTimeout(() => $('codeDialog').showModal(), 0); }
      throw new Error(err);
    }
    const reader = res.body.getReader(); const dec = new TextDecoder();
    let reply = '';
    for (;;) {
      const { value, done } = await reader.read(); if (done) break;
      reply += dec.decode(value, { stream: true });
      out.textContent = reply; $('log').scrollTop = $('log').scrollHeight;
    }
    if (!reply) throw new Error('Empty reply, please try again.');
    history.push({ role: 'assistant', content: reply });
  } catch (e) {
    out.remove(); history.pop();
    addMsg('err', e.message);
  } finally { $('send').disabled = false; }
}

$('chatForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const t = $('input').value.trim(); if (!t || $('send').disabled) return;
  $('input').value = ''; send(t);
});
$('input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('chatForm').requestSubmit(); }
});
$('clear').onclick = reset;
$('codeForm').addEventListener('submit', () => store.set('zt_code', $('code').value.trim()));

reset();
fetch('/api/config').then(r => r.json()).then(c => {
  needsCode = c.needsCode;
  if (needsCode && !store.get('zt_code', '')) $('codeDialog').showModal();
}).catch(() => {});
</script>
</body>
</html>
